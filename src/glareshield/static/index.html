<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glareshield</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#16243a"/><path d="M5 21 11 11l5 8 5-8 6 10" fill="none" stroke="#5aa9ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><strong>GLARESHIELD</strong><small>Le cockpit, dans la lumière.</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="Navigation principale"></nav>
    <div class="sidebar-foot">
      <div class="status-line"><span class="dot" id="simDot"></span><span id="connection">Connexion…</span></div>
      <div class="status-line"><span class="dot" id="rulesDot"></span><span id="rulesState">—</span></div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div><h1 id="pageTitle">Glareshield</h1><div class="subtitle" id="pageSubtitle"></div></div>
      <span class="badge warn" id="testState" hidden></span><div class="actions" id="pageActions"></div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="toasts" role="status" aria-live="polite"></div>
<dialog id="editor"><form id="form"><h2 id="title"></h2><div class="dialog-body" id="fields"></div><p id="editorStatus" class="dialog-body" role="status" hidden></p><div class="dialog-foot row"><button class="primary" type="submit">Enregistrer</button><button type="button" onclick="editor.close()">Annuler</button><span class="spacer"></span><button type="button" class="danger" id="remove">Supprimer</button></div></form></dialog>
<dialog id="previewDialog"><form id="previewForm"><h2>Tester pendant 3 secondes</h2><div class="dialog-body" id="previewFields"></div><p id="previewError" class="error dialog-body" role="status"></p><div class="dialog-foot"><button class="primary" type="submit">Lancer le test 3 s</button><button type="button" onclick="previewDialog.close()">Annuler</button></div></form></dialog>
<script>const TOKEN='__TOKEN__';</script>
<script src="/static/app.js"></script>
<script src="/static/ai.js"></script>
</body>
</html>
