<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glareshield</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,system-ui,sans-serif;background:#10151f;color:#e8edf5}*{box-sizing:border-box}body{margin:0}header{padding:24px 5vw;border-bottom:1px solid #293346;display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:26px;letter-spacing:.04em}small,.muted{color:#9babc1}main{max-width:1200px;margin:28px auto;padding:0 24px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}button,select,input,textarea{font:inherit;color:inherit;border:1px solid #35435c;background:#192334;border-radius:8px;padding:10px}button{cursor:pointer}button:hover{border-color:#75bfff}button.primary{background:#176bc1}nav button.active{background:#244464;border-color:#75bfff}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{border:1px solid #2a374d;background:#151e2c;border-radius:12px;padding:20px}.card h3{margin-top:0}.big{font-size:24px;margin:10px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.stack{display:grid;gap:12px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #2a374d}th{color:#9babc1}label{display:grid;gap:6px;margin:10px 0}label.check{display:flex;align-items:center;gap:10px}input[type=checkbox]{width:18px;height:18px}input[type=color]{width:100%;height:42px}textarea{width:100%;min-height:150px}dialog{width:min(760px,95vw);max-height:90vh;background:#151e2c;color:inherit;border:1px solid #415b7b;border-radius:14px;padding:24px}dialog::backdrop{background:#000a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.error{color:#ffadad}.ok{color:#8edac0}#message{min-height:24px;margin-bottom:12px}.condition{padding:12px;border-left:2px solid #415b7b;margin-bottom:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.tag{font-size:12px;color:#86c9ff}footer{margin-top:24px;font-size:13px;color:#92a4bd}@media(max-width:600px){.grid{grid-template-columns:1fr}header{padding:20px}td{padding:8px}}
#view>.card{margin-top:16px}.cards{margin-top:16px}#form{display:flex;flex-direction:column;max-height:calc(90vh - 50px)}#fields{overflow:auto;min-height:0}#form>.row{flex-shrink:0;padding-top:12px}#form>h2{flex-shrink:0}

<header><div><h1>GLARESHIELD</h1><small>Le cockpit, dans la lumière.</small></div><span id="connection">Connexion…</span></header>
<main><nav id="nav"></nav><div id="message" role="status"></div><section id="view"></section><footer>Application locale · Les sons du processus surveillé incluent voix et notifications. La détection audio ne les distingue pas.</footer></main>
<dialog id="editor"><form id="form"><h2 id="title"></h2><div id="fields"></div><div class="row"><button class="primary" type="submit">Enregistrer</button><button type="button" onclick="editor.close()">Annuler</button><button type="button" id="remove">Supprimer</button></div></form></dialog>
<script>
const TOKEN='__TOKEN__';let config,state,tab='Tableau de bord',editing=null,connectionLost=false;const $=s=>document.querySelector(s);const tabs=['Tableau de bord','Affectations','Appareils','Contrôleurs','Groupes','Portées','Sources','Effets','Règles','Réglages','Journal'];
function el(tag,text,attrs={}){let n=document.createElement(tag);if(text!==null)n.textContent=text;Object.assign(n,attrs);return n}
async function api(path,method='GET',body){let r;try{r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json','X-Glareshield-Token':TOKEN},body:body===undefined?undefined:JSON.stringify(body)})}catch(e){connectionLost=true;$('#connection').textContent='Reconnexion en cours…';throw Error('Connexion à Glareshield interrompue. Reconnexion en cours…')}let d=await r.json();if(r.status===403)throw Error('Session renouvelée après redémarrage : actualisez la page (F5).');if(!r.ok)throw Error(d.detail||'Opération refusée');return d}
function message(text,error=false){$('#message').textContent=text;$('#message').className=error?'error':'ok'}
function action(text,fn,parent){let b=el('button',text,{type:'button'});b.onclick=()=>Promise.resolve().then(fn).catch(e=>message(e.message,true));parent.append(b);return b}
const OPTION_LABELS={always:'Toujours',eq:'Égal à',ne:'Différent de',gt:'Supérieur à',ge:'Supérieur ou égal',lt:'Inférieur à',le:'Inférieur ou égal',active:'Active',all:'Toutes (ET)',any:'Au moins une (OU)',static:'Fixe',blink:'Clignotement',pulse:'Impulsions',level_map:'Paliers',sound:'Son',mock:'Simulée',lvar:'Variable du cockpit',audio_process:'Activité audio',simulator_state:'État du simulateur',keyboard:'Touche clavier',light:'Lampe',audio:'Sortie audio'};
function field(parent,name,value,type='text',choices=null){let l=el('label',name),i=choices?el('select',null):el('input',null,{type});if(choices)for(let c of choices)i.append(el('option',OPTION_LABELS[c]||c,{value:c}));if(type==='checkbox'){l.className='check';i.checked=!!value}else i.value=value??'';if(type==='number')i.step='any';i.setAttribute('aria-label',name);l.append(i);parent.append(l);return()=>type==='checkbox'?i.checked:type==='number'?Number(i.value):i.value}
function checks(parent,title,choices,selected=[]){let box=el('div',null);box.append(el('h4',title));let readers=choices.map(([id,label])=>[id,field(box,label,selected.includes(id),'checkbox')]);parent.append(box);return()=>readers.filter(([id,read])=>read()).map(([id])=>id)}
function light(parent,state={}){let box=el('div',null,{className:'grid'});parent.append(box);let on=field(box,'Allumée',state.on??true,'checkbox'),bright=field(box,'Luminosité (%)',state.brightness??100,'number'),mode=field(box,'Couleur',state.color?'RVB':state.kelvin?'Température':'Conserver','text',['Conserver','RVB','Température']),color=field(box,'Couleur RVB','#'+(state.color||[255,255,255]).map(v=>v.toString(16).padStart(2,'0')).join(''),'color'),kelvin=field(box,'Température (K)',state.kelvin??2700,'number'),transition=field(box,'Transition (ms)',state.transition_ms??0,'number');return()=>{let out={on:on(),brightness:bright(),transition_ms:transition()};if(mode()==='RVB')out.color=color().slice(1).match(/../g).map(v=>parseInt(v,16));if(mode()==='Température')out.kelvin=kelvin();return out}}
function condition(parent,c={op:'always'}){let box=el('div',null,{className:'condition'}),content=el('div',null);parent.append(box);let op=field(box,'Condition',c.op,'text',['always','eq','ne','gt','ge','lt','le','active','all','any']);box.append(content);let read;function update(){content.replaceChildren();if(['all','any'].includes(op())){let children=(c.conditions?.length?c.conditions:[{op:'always'}]).map(v=>condition(content,v));action('Ajouter une condition',()=>children.push(condition(content)),content);read=()=>({op:op(),conditions:children.map(fn=>fn())})}else if(op()==='always')read=()=>({op:'always'});else{let source=field(content,'Source',c.source||Object.keys(config.sources)[0],'text',Object.keys(config.sources));let value=field(content,'Valeur',c.value??1,'number');read=()=>op()==='active'?{op:op(),source:source()}:{op:op(),source:source(),value:value()}}}box.querySelector('select').onchange=update;update();return()=>read()}
function selectors(parent,selected){let choices=[['scope:active','Portée active'],...Object.keys(config.groups).map(k=>['group:'+k,'Groupe : '+k]),...Object.entries(config.devices).map(([k,v])=>['device:'+k,v.name])];let include=checks(parent,'Cibles',choices,selected),exclude=checks(parent,'Exclusions',choices.filter(([id])=>id!=='scope:active'),selected.filter(v=>v.startsWith('exclude:')).map(v=>v.slice(8)));return()=>[...include(),...exclude().map(v=>'exclude:'+v)]}
function selectedDevices(targets){function group(id,seen=new Set()){if(seen.has(id))return [];return (config.groups[id]||[]).flatMap(v=>v.startsWith('group:')?group(v.slice(6),new Set([...seen,id])):[v])}function expand(v){if(v==='scope:active')return (config.scopes[config.active_scope]||[]).flatMap(v=>group(v));if(v.startsWith('group:'))return group(v.slice(6));if(v.startsWith('device:'))return [v.slice(7)];return []}let included=new Set(targets.filter(v=>!v.startsWith('exclude:')).flatMap(expand));for(let id of targets.filter(v=>v.startsWith('exclude:')).flatMap(v=>expand(v.slice(8))))included.delete(id);return [...included].filter(id=>config.devices[id])}
function assignments(view){view.append(el('h2','Affectations par fonction'),el('p','Chaque fonction possède sa propre sélection. Un groupe suit ses membres ; la portée active suit le choix du tableau de bord. Une sélection de lampes individuelles reste indépendante de la portée.'));let cards=el('div',null,{className:'cards'});view.append(cards);for(let rule of config.rules){let card=el('div',null,{className:'card'}),ids=selectedDevices(rule.targets);card.append(el('h3',rule.name||rule.id),el('span',(rule.enabled?'Activée':'Désactivée')+' · Priorité '+rule.priority,{className:'tag'}),el('p',ids.length?ids.map(id=>config.devices[id].name).join(', '):'Aucun appareil affecté'),el('small',rule.targets.includes('scope:active')?'Suit la portée active':'Sélection indépendante de la portée'));action('Choisir les lampes',()=>editAssignment(rule.id),card);action('Régler la fonction',()=>edit('rules',rule.id),card);cards.append(card)}}
function editAssignment(id){let rule=config.rules.find(v=>v.id===id);$('#title').textContent='Affectations · '+(rule.name||id);let p=$('#fields');p.replaceChildren();let enabled=field(p,'Fonction activée',rule.enabled,'checkbox'),mode=field(p,'Mode de sélection',rule.targets.every(v=>v.startsWith('device:'))?'Lampes individuelles':'Groupes et portée','text',['Lampes individuelles','Groupes et portée']);let individual=el('div',null),advanced=el('div',null),preview=el('p',null,{className:'muted'});p.append(individual,advanced,preview);let lamps=checks(individual,'Appareils de cette fonction',Object.entries(config.devices).map(([k,v])=>[k,v.name+(v.kind==='audio'?' (audio)':'')]),selectedDevices(rule.targets)),targets=selectors(advanced,rule.targets);let read=()=>mode()==='Lampes individuelles'?lamps().map(v=>'device:'+v):targets();function update(){individual.hidden=mode()!=='Lampes individuelles';advanced.hidden=mode()!=='Groupes et portée';let ids=selectedDevices(read());preview.textContent=ids.length?'Sélection effective : '+ids.map(id=>config.devices[id].name).join(', '):'Aucune cible : cette fonction ne pilotera aucun appareil.'}p.onchange=update;update();let copy=field(p,'Copier les affectations de','', 'text',['',...config.rules.filter(v=>v.id!==id).map(v=>v.id)]);action('Copier les appareils actuels',()=>{let other=config.rules.find(v=>v.id===copy());if(!other)return;let ids=new Set(selectedDevices(other.targets));for(let input of individual.querySelectorAll('input'))input.checked=ids.has(Object.keys(config.devices)[[...individual.querySelectorAll('input')].indexOf(input)]);let select=p.querySelector('select');select.value='Lampes individuelles';update()},p);$('#remove').hidden=true;$('#form').onsubmit=async e=>{e.preventDefault();try{let current=config.rules.find(v=>v.id===id);current.targets=read();current.enabled=enabled();await persist();editor.close()}catch(e){config=await api('config');message(e.message,true)}};editor.showModal()}
const SETTING_LABELS={render_hz:'Cadence du moteur (Hz)',max_flash_hz:'Plafond du clignotement (Hz, maximum 2)',brightness_threshold:'Écart minimal de luminosité (%)',timeout_s:'Délai maximal de commande (s)',restore_timeout_s:'Délai maximal de restauration (s)',sound_timeout_s:'Délai maximal de diffusion sonore (s)',retry_initial_s:'Délai initial après erreur (s)',retry_max_s:'Délai maximal après erreur (s)',discovery_interval_s:'Actualisation des adresses (s)',ui_refresh_ms:'Actualisation de l’interface (ms)',test_duration_s:'Durée des tests de source (s)'};
async function persist(){try{await api('config','PUT',config)}catch(e){config=await api('config');throw e}config=await api('config');message('Configuration enregistrée et appliquée.');render()}
function edit(section,id=null){editing={section,id};let old=id?(section==='rules'?config.rules.find(v=>v.id===id):config[section][id]):null;$('#title').textContent=(id?'Modifier : '+id:'Ajouter')+' · '+section;let p=$('#fields');p.onchange=null;p.replaceChildren();let key=field(p,'Identifiant',id||'');let read;
if(section==='devices'){let name=field(p,'Nom',old?.name||''),driver=field(p,'Pilote',old?.driver||'hue','text',['hue','nanoleaf','airplay','mock']),controller=field(p,'Contrôleur',old?.controller||'','text',['',...Object.keys(config.controllers)]),kind=field(p,'Type',old?.kind||'light','text',['light','audio']),resource=field(p,'Identifiant de ressource',old?.resource_id||''),stable=field(p,'Identifiant stable',old?.stable_id||'');read=()=>({name:name(),driver:driver(),controller:controller()||null,kind:kind(),resource_id:resource()||null,stable_id:stable()||null})}
if(section==='controllers'){let type=field(p,'Type',old?.type||'hue','text',['hue','nanoleaf','airplay']),stable=field(p,'Identifiant stable',old?.stable_id||''),host=field(p,'Adresse manuelle (vide : découverte)',old?.host||''),port=field(p,'Port manuel (0 : automatique)',old?.port||0,'number');read=()=>({type:type(),stable_id:stable(),host:host()||null,port:port()||null})}
if(section==='groups')read=checks(p,'Membres',[...Object.entries(config.devices).map(([k,v])=>[k,v.name]),...Object.keys(config.groups).filter(k=>k!==id).map(k=>['group:'+k,'Groupe : '+k])],old||[]);
if(section==='scopes')read=checks(p,'Groupes',Object.keys(config.groups).map(k=>[k,k]),old||[]);
if(section==='sources'){let type=field(p,'Type',old?.type||'mock','text',['mock','lvar','audio_process','simulator_state','keyboard']),name=field(p,'Variable (pause : paused, état : running)',old?.name||''),poll=field(p,'Intervalle (ms)',old?.poll_ms??100,'number'),processes=field(p,'Processus audio (séparés par virgules)',old?.process_names?.join(', ')||''),threshold=field(p,'Seuil audio (0 à 1)',old?.threshold??.02,'number'),min=field(p,'Durée minimale (ms)',old?.min_ms??300,'number'),cooldown=field(p,'Délai entre contacts (s)',old?.cooldown_s??10,'number'),hold=field(p,'Maintien du contact (s)',old?.hold_s??5,'number'),keyCode=field(p,'Code de touche Windows (0 : aucun)',old?.key_code??0,'number');read=()=>({type:type(),name:name()||null,poll_ms:poll(),process_names:processes().split(',').map(v=>v.trim()).filter(Boolean),threshold:threshold(),min_ms:min(),cooldown_s:cooldown(),hold_s:hold(),key_code:keyCode()||null})}
if(section==='effects'){let type=field(p,'Type',old?.type||'static','text',['static','blink','pulse','level_map','sound']),body=el('div',null);p.append(body);let effectRead;function build(){body.replaceChildren();let value=old?.type===type()?old:{};if(type()==='static'){let l=light(body,value.state);effectRead=()=>({type:'static',state:l()})}else if(['blink','pulse'].includes(type())){let color=field(body,'Couleur','#'+(value.color||[255,0,0]).map(v=>v.toString(16).padStart(2,'0')).join(''),'color'),period=field(body,'Période (s)',value.period_s||1,'number'),high=field(body,'Luminosité haute (%)',value.high??100,'number'),low=field(body,'Luminosité basse (%)',value.low??15,'number'),duty=field(body,'Fraction haute (0 à 1)',value.duty??.5,'number'),cycles=field(body,'Cycles (0 : continu)',value.cycles||0,'number');effectRead=()=>({type:type(),color:color().slice(1).match(/../g).map(v=>parseInt(v,16)),period_s:period(),high:high(),low:low(),duty:duty(),cycles:cycles()||null})}else if(type()==='sound'){let file=field(body,'Fichier WAV dans local/sounds',value.file||'warning.wav'),volume=field(body,'Volume (0 à 1)',value.volume??.5,'number'),repeat=field(body,'Répétition (s, 0 : unique)',value.repeat_s??0,'number');effectRead=()=>({type:'sound',file:file(),volume:volume(),repeat_s:repeat()})}else{let rows=[];function row(k,v){let box=el('div',null,{className:'card'});body.append(box);let key=field(box,'Valeur de source',k),l=light(box,v);let record={enabled:true,key,l};rows.push(record);action('Retirer ce palier',()=>{record.enabled=false;box.remove()},box)}for(let [k,v] of Object.entries(value.map||{}))row(k,v);action('Ajouter un palier',()=>row('',{}),body);effectRead=()=>({type:'level_map',map:Object.fromEntries(rows.filter(v=>v.enabled).map(v=>[v.key(),v.l()]))})}}p.querySelector('select').onchange=build;build();read=()=>effectRead()}
if(section==='rules'){let name=field(p,'Nom de la fonction',old?.name||''),enabled=field(p,'Activée',old?.enabled??true,'checkbox'),priority=field(p,'Priorité',old?.priority??10,'number'),source=field(p,'Source pour table de niveaux',old?.source||'','text',['',...Object.keys(config.sources)]),effect=field(p,'Effet',old?.effect||Object.keys(config.effects)[0],'text',Object.keys(config.effects)),sound=field(p,'Son associé',old?.sound||'','text',['',...Object.entries(config.effects).filter(([k,v])=>v.type==='sound').map(([k])=>k)]),sim=field(p,'Exiger le simulateur connecté',old?.requires_simulator??true,'checkbox'),pause=field(p,'Suspendre pendant la pause',old?.suspend_when_paused??false,'checkbox'),cond=condition(p,old?.condition),targets=selectors(p,old?.targets||[]);read=()=>({id:key(),name:name()||null,enabled:enabled(),priority:priority(),source:source()||null,effect:effect(),sound:sound()||null,requires_simulator:sim(),suspend_when_paused:pause(),condition:cond(),targets:targets()})}
$('#remove').hidden=!id;$('#remove').onclick=async()=>{try{if(section==='rules')config.rules=config.rules.filter(v=>v.id!==id);else delete config[section][id];await persist();editor.close()}catch(e){config=await api('config');message(e.message,true)}};
$('#form').onsubmit=async e=>{e.preventDefault();try{let k=key().trim();if(!k)throw Error('Identifiant requis.');if(k!==id&&(section==='rules'?config.rules.some(v=>v.id===k):k in config[section]))throw Error('Identifiant déjà utilisé.');let value=read();if(section==='rules'){config.rules=config.rules.filter(v=>v.id!==id);config.rules.push(value)}else{if(id)delete config[section][id];config[section][k]=value}await persist();editor.close()}catch(e){config=await api('config');message(e.message,true)}};editor.showModal()}
function render(){let nav=$('#nav');nav.replaceChildren();for(let name of tabs){let b=action(name,()=>{tab=name;render()},nav);if(tab===name)b.className='active'}let view=$('#view');view.replaceChildren();if(tab==='Tableau de bord'){let cards=el('div',null,{className:'cards'});view.append(cards);for(let [title,value] of [['Simulateur',state?.connected?'Connecté':'En attente'],['Pause',state?.paused?'En pause':'Reprise'],['États sauvegardés',state?.snapshots??0]]){let c=el('div',null,{className:'card'});c.append(el('h3',title),el('div',String(value),{className:'big'}));cards.append(c)}let box=el('div',null,{className:'card'});view.append(box);let scope=field(box,'Portée active',config.active_scope,'text',Object.keys(config.scopes));box.querySelector('select').onchange=async()=>{try{await api('scope','POST',{scope:scope()});config=await api('config');message('Portée appliquée.');render()}catch(e){message(e.message,true)}};action(state?.suspended?'Reprendre les règles':'Suspendre et restaurer',async()=>{await api('suspend','POST',{suspended:!state.suspended});await refresh()},box);let monitor=el('div',null,{className:'card'});monitor.append(el('h3','Moniteur des sources'));view.append(monitor);for(let [key,source] of Object.entries(config.sources)){let row=el('div',null,{className:'row'});row.append(el('span',key+' : '+String(state?.values[key]??'—')));let val=field(row,'Valeur de test',1,'number');action('Tester '+(config.settings.test_duration_s??5)+' s',()=>api('test/source','POST',{source:key,value:val(),seconds:config.settings.test_duration_s??5}),row);if(source.type==='audio_process')row.append(el('span','Niveau : '+(state?.audio_levels[key]??0).toFixed(4),{className:'tag'}));monitor.append(row)}for(let [id,rule] of Object.entries(state?.winners||{}))view.append(el('p',config.devices[id]?.name+' → '+rule+(state.backgrounds?.[id]&&state.backgrounds[id]!==rule?' (fond : '+state.backgrounds[id]+')':'')));for(let [id,error] of Object.entries({...state?.controller_errors,...state?.source_errors,...state?.errors}))view.append(el('p',id+' : '+error,{className:'error'}));return}
if(tab==='Affectations'){assignments(view);return}
if(tab==='Journal'){for(let log of [...(state?.logs||[])].reverse()){let c=el('div',null,{className:'card'});c.append(el('strong',log.time+' · '+log.event),el('pre',log.details?JSON.stringify(log.details,null,2):''));view.append(c)}return}
if(tab==='Réglages'){let readers={};for(let [key,value] of Object.entries(config.settings))if(typeof value==='number')readers[key]=field(view,SETTING_LABELS[key]||key,value,'number');let rates={};for(let key of new Set([...Object.keys(config.settings.driver_rates),...Object.values(config.devices).map(d=>d.driver)]))rates[key]=field(view,'Cadence : '+key,config.settings.driver_rates[key]||10,'number');action('Enregistrer',async()=>{for(let [key,read] of Object.entries(readers))config.settings[key]=read();config.settings.driver_rates=Object.fromEntries(Object.entries(rates).map(([k,v])=>[k,v()]));await persist()},view);return}
if(tab==='Contrôleurs'){let setup=el('div',null,{className:'card'});view.append(setup);setup.append(el('h3','Découverte et appairage'),el('p','Hue : appuyer sur le bouton du pont pendant l’attente. Nanoleaf : ouvrir Connexion à l’API dans les réglages du constructeur. Les clés restent dans le dossier local.'));action('Découvrir',async()=>{message('Découverte en cours…');let r=await api('setup/discover','POST',{});message(r.services+' services découverts.');},setup);action('Appairer Hue',async()=>{message('Appuyer maintenant sur le bouton du pont Hue.');await api('setup/pair','POST',{driver:'hue'});message('Pont appairé. Importer les appareils pour les ajouter.');},setup);action('Appairer Nanoleaf',async()=>{let model=prompt('Modèle Nanoleaf à sélectionner (vide si un seul contrôleur)');if(model===null)return;message('Ouvrir maintenant Connexion à l’API dans l’application Nanoleaf.');await api('setup/pair','POST',{driver:'nanoleaf',model:model||null});message('Contrôleur appairé.');},setup);action('Importer les appareils appairés',async()=>{let r=await api('setup/import','POST',{});config=await api('config');message(r.devices+' appareils importés. Vérifier les groupes et les portées.');render();},setup);}
let section={'Appareils':'devices','Contrôleurs':'controllers','Groupes':'groups','Portées':'scopes','Sources':'sources','Effets':'effects','Règles':'rules'}[tab];action('Ajouter',()=>edit(section),view);let cards=el('div',null,{className:'cards'});view.append(cards);let entries=section==='rules'?config.rules.map(v=>[v.id,v]):Object.entries(config[section]);for(let [id,value] of entries){let c=el('div',null,{className:'card'});c.append(el('h3',value.name||id),el('span',id,{className:'tag'}),el('pre',Array.isArray(value)?value.join('\n'):Object.entries(value).filter(([k,v])=>v!==null&&!['name','initial_state','condition'].includes(k)).map(([k,v])=>k+' : '+(Array.isArray(v)?v.join(', '):typeof v==='object'?JSON.stringify(v):v)).join('\n')));action('Modifier',()=>edit(section,id),c);if(section==='devices'&&value.kind==='light')action('Repérer',()=>api('identify/'+id,'POST',{}),c);if(section==='devices'&&value.kind==='audio'){let sound=field(c,'Son de test',Object.keys(config.effects).find(k=>config.effects[k].type==='sound'),'text',Object.keys(config.effects).filter(k=>config.effects[k].type==='sound'));action('Écouter',()=>api('test/sound/'+id,'POST',{effect:sound()}),c)}cards.append(c)}}
async function refresh(){state=await api('status');if(connectionLost){connectionLost=false;message('Connexion rétablie.')}$('#connection').textContent=state.connected?'● Simulateur connecté':'○ Simulateur en attente';if((tab==='Tableau de bord'||tab==='Journal')&&!['INPUT','SELECT'].includes(document.activeElement.tagName))render()}
function scheduleRefresh(){setTimeout(async()=>{try{if(!config)config=await api('config');await refresh()}catch(e){message(e.message,true)}scheduleRefresh()},config?.settings.ui_refresh_ms??1500)}
(async()=>{try{config=await api('config');await refresh();render()}catch(e){message(e.message,true)}finally{scheduleRefresh()}})();
</script></html>
