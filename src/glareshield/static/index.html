<style>
:root{color-scheme:dark;font-family:Segoe UI,system-ui,sans-serif;background:#10151f;color:#e8edf5}*{box-sizing:border-box}body{margin:0}header{padding:24px 5vw;border-bottom:1px solid #293346;display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:26px;letter-spacing:.04em}small,.muted{color:#9babc1}main{max-width:1200px;margin:28px auto;padding:0 24px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}button,select,input,textarea{font:inherit;color:inherit;border:1px solid #35435c;background:#192334;border-radius:8px;padding:10px}button{cursor:pointer}button:hover{border-color:#75bfff}button.primary{background:#176bc1}nav button.active{background:#244464;border-color:#75bfff}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{border:1px solid #2a374d;background:#151e2c;border-radius:12px;padding:20px}.card h3{margin-top:0}.big{font-size:24px;margin:10px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.stack{display:grid;gap:12px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #2a374d}th{color:#9babc1}label{display:grid;gap:6px;margin:10px 0}label.check{display:flex;align-items:center;gap:10px}input[type=checkbox]{width:18px;height:18px}input[type=color]{width:100%;height:42px}textarea{width:100%;min-height:150px}dialog{width:min(760px,95vw);max-height:90vh;background:#151e2c;color:inherit;border:1px solid #415b7b;border-radius:14px;padding:24px}dialog::backdrop{background:#000a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.error{color:#ffadad}.ok{color:#8edac0}#message{min-height:24px;margin-bottom:12px}.condition{padding:12px;border-left:2px solid #415b7b;margin-bottom:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.tag{font-size:12px;color:#86c9ff}footer{margin-top:24px;font-size:13px;color:#92a4bd}@media(max-width:600px){.grid{grid-template-columns:1fr}header{padding:20px}td{padding:8px}}
.muted{font-size:14px;line-height:1.5}button:disabled{opacity:.5;cursor:default}.card p{line-height:1.5}.card>small{display:block;margin-bottom:10px}.card>button{margin-right:8px;margin-top:8px}#view>.card{margin-top:16px}.cards{margin-top:16px}#form{display:flex;flex-direction:column;max-height:calc(90vh - 50px)}#fields{overflow:auto;min-height:0}#form>.row{flex-shrink:0;padding-top:12px}#form>h2{flex-shrink:0}

<header><div><h1>GLARESHIELD</h1><small>Le cockpit, dans la lumière.</small></div><span id="connection">Connexion…</span></header>
<main><nav id="nav"></nav><div id="message" role="status"></div><section id="view"></section><footer>Application locale · Les sons du processus surveillé incluent voix et notifications. La détection audio ne les distingue pas.</footer></main>
<dialog id="editor"><form id="form"><h2 id="title"></h2><div id="fields"></div><p id="editorStatus" role="status"></p><div class="row"><button class="primary" type="submit">Enregistrer</button><button type="button" onclick="editor.close()">Annuler</button><button type="button" id="remove">Supprimer</button></div></form></dialog>

<script>
const TOKEN='__TOKEN__';let config,state,tab='Tableau de bord',editing=null,connectionLost=false,sessionToken=TOKEN;const $=s=>document.querySelector(s);const tabs=['Tableau de bord','Affectations','Appareils','Contrôleurs','Groupes','Portées','Sources','Effets','Règles','Réglages','Journal'];
function el(tag,text,attrs={}){let n=document.createElement(tag);if(text!==null)n.textContent=text;Object.assign(n,attrs);return n}
async function api(path,method='GET',body){let r;let send=()=>fetch('/api/'+path,{method,headers:{'Content-Type':'application/json','X-Glareshield-Token':sessionToken},body:body===undefined?undefined:JSON.stringify(body)});try{r=await send();if(r.status===403){let page=await fetch('/',{cache:'no-store'}),match=(await page.text()).match(/const TOKEN='([^']+)'/);if(match&&match[1]!==sessionToken){sessionToken=match[1];r=await send()}}}catch(e){connectionLost=true;$('#connection').textContent='Reconnexion en cours…';throw Error('Connexion à Glareshield interrompue. Reconnexion en cours…')}let d=await r.json();if(r.status===403)throw Error('Session renouvelée après redémarrage : actualisez la page (F5).');if(!r.ok)throw Error(d.detail||'Opération refusée');return d}
function message(text,error=false){$('#message').textContent=text;$('#message').className=error?'error':'ok';let note=$('#editorStatus');if(note){note.textContent=text;note.className=error?'error':'ok'}}
function action(text,fn,parent){let b=el('button',text,{type:'button'});b.onclick=()=>Promise.resolve().then(fn).catch(e=>message(e.message,true));parent.append(b);return b}
const OPTION_LABELS={always:'Toujours',eq:'Égal à',ne:'Différent de',gt:'Supérieur à',ge:'Supérieur ou égal',lt:'Inférieur à',le:'Inférieur ou égal',active:'Active',all:'Toutes (ET)',any:'Au moins une (OU)',static:'Fixe',blink:'Clignotement',pulse:'Impulsions',level_map:'Paliers',sound:'Son',mock:'Simulée',lvar:'Variable du cockpit',audio_process:'Activité audio',simulator_state:'État du simulateur',keyboard:'Touche clavier',light:'Lampe',audio:'Sortie audio'};
function field(parent,name,value,type='text',choices=null){let l=el('label',name),i=choices?el('select',null):el('input',null,{type});if(choices)for(let c of choices)i.append(el('option',OPTION_LABELS[c]||(['Effet','Son associé'].includes(name)&&config?.effects[c]?effectTitle(c):c),{value:c}));if(type==='checkbox'){l.className='check';i.checked=!!value}else i.value=value??'';if(type==='number'){i.step='any';let limits={'Luminosité (%)':[0,100],'Luminosité haute (%)':[1,100],'Luminosité basse (%)':[1,100],'Temps en phase haute (%)':[0,100],'Volume (%)':[0,100],'Température (K)':[1000,10000,1],'Transition (ms)':[0,60000,1],'Cycles (0 : continu)':[0,null,1],'Intervalle (ms)':[50,60000,1],'Seuil audio (0 à 1)':[0,1],'Code de touche Windows (0 : aucun)':[0,254,1]};if(name.startsWith('Fréquence des '))limits[name]=[0,config?.settings.max_flash_hz??2];if(limits[name]){let [min,max,step]=limits[name];i.min=min;if(max!==null)i.max=max;if(step)i.step=step}}i.setAttribute('aria-label',name);l.append(i);let hint=(name==='Couleur'&&type==='color'?'Cliquer sur la couleur pour choisir la teinte du flash.':FIELD_HELP[name])||Object.entries(SETTING_LABELS).find(([k,v])=>v===name)?.[0];if(hint)l.append(el('small',name==='Couleur'&&type==='color'?'Cliquer sur la couleur pour choisir la teinte du flash.':FIELD_HELP[name]||SETTING_HELP[hint],{className:'muted'}));parent.append(l);return()=>type==='checkbox'?i.checked:type==='number'?Number(i.value):i.value}
function checks(parent,title,choices,selected=[]){let box=el('div',null);box.append(el('h4',title));let readers=choices.map(([id,label])=>[id,field(box,label,selected.includes(id),'checkbox')]);parent.append(box);return()=>readers.filter(([id,read])=>read()).map(([id])=>id)}
function light(parent,state={}){let box=el('div',null,{className:'grid'});parent.append(box);let on=field(box,'Allumée',state.on??true,'checkbox'),bright=field(box,'Luminosité (%)',state.brightness??100,'number'),mode=field(box,'Couleur',state.color?'RVB':state.kelvin?'Température':'Conserver','text',['Conserver','RVB','Température']),color=field(box,'Couleur RVB','#'+(state.color||[255,255,255]).map(v=>v.toString(16).padStart(2,'0')).join(''),'color'),kelvin=field(box,'Température (K)',state.kelvin??2700,'number'),transition=field(box,'Transition (ms)',state.transition_ms??0,'number');return()=>{let out={on:on(),brightness:bright(),transition_ms:transition()};if(mode()==='RVB')out.color=color().slice(1).match(/../g).map(v=>parseInt(v,16));if(mode()==='Température')out.kelvin=kelvin();return out}}
function condition(parent,c={op:'always'}){let box=el('div',null,{className:'condition'}),content=el('div',null);parent.append(box);let op=field(box,'Condition',c.op,'text',['always','eq','ne','gt','ge','lt','le','active','all','any']);box.append(content);let read;function update(){content.replaceChildren();if(['all','any'].includes(op())){let children=(c.conditions?.length?c.conditions:[{op:'always'}]).map(v=>condition(content,v));action('Ajouter une condition',()=>children.push(condition(content)),content);read=()=>({op:op(),conditions:children.map(fn=>fn())})}else if(op()==='always')read=()=>({op:'always'});else{let source=field(content,'Source',c.source||Object.keys(config.sources)[0],'text',Object.keys(config.sources));let value=field(content,'Valeur',c.value??1,'number');read=()=>op()==='active'?{op:op(),source:source()}:{op:op(),source:source(),value:value()}}}box.querySelector('select').onchange=update;update();return()=>read()}
function selectors(parent,selected){let choices=[['scope:active','Portée active'],...Object.keys(config.groups).map(k=>['group:'+k,'Groupe : '+k]),...Object.entries(config.devices).map(([k,v])=>['device:'+k,v.name])];let include=checks(parent,'Cibles',choices,selected),exclude=checks(parent,'Exclusions',choices.filter(([id])=>id!=='scope:active'),selected.filter(v=>v.startsWith('exclude:')).map(v=>v.slice(8)));return()=>[...include(),...exclude().map(v=>'exclude:'+v)]}
function selectedDevices(targets){function group(id,seen=new Set()){if(seen.has(id))return [];return (config.groups[id]||[]).flatMap(v=>v.startsWith('group:')?group(v.slice(6),new Set([...seen,id])):[v])}function expand(v){if(v==='scope:active')return (config.scopes[config.active_scope]||[]).flatMap(v=>group(v));if(v.startsWith('group:'))return group(v.slice(6));if(v.startsWith('device:'))return [v.slice(7)];return []}let included=new Set(targets.filter(v=>!v.startsWith('exclude:')).flatMap(expand));for(let id of targets.filter(v=>v.startsWith('exclude:')).flatMap(v=>expand(v.slice(8))))included.delete(id);return [...included].filter(id=>config.devices[id])}
function assignments(view){view.append(el('h2','Affectations par fonction'),el('p','Chaque fonction possède sa propre sélection. Un groupe suit ses membres ; la portée active suit le choix du tableau de bord. Une sélection de lampes individuelles reste indépendante de la portée.'));let cards=el('div',null,{className:'cards'});view.append(cards);for(let rule of config.rules){let card=el('div',null,{className:'card'}),ids=selectedDevices(rule.targets);card.append(el('h3',rule.name||rule.id),el('span',(rule.enabled?'Activée':'Désactivée')+' · Priorité '+rule.priority,{className:'tag'}),el('p',ids.length?ids.map(id=>config.devices[id].name).join(', '):'Aucun appareil affecté'),el('small',rule.targets.includes('scope:active')?'Suit la portée active':'Sélection indépendante de la portée'));action('Choisir les lampes',()=>editAssignment(rule.id),card);action('Régler la fonction',()=>edit('rules',rule.id),card);action('Tester 3 s',()=>openTest(testContext('assignments',rule.id)),card);cards.append(card)}}
function editAssignment(id){let rule=config.rules.find(v=>v.id===id);$('#title').textContent='Affectations · '+(rule.name||id);let p=$('#fields');p.replaceChildren();let enabled=field(p,'Fonction activée',rule.enabled,'checkbox'),mode=field(p,'Mode de sélection',rule.targets.every(v=>v.startsWith('device:'))?'Lampes individuelles':'Groupes et portée','text',['Lampes individuelles','Groupes et portée']);let individual=el('div',null),advanced=el('div',null),preview=el('p',null,{className:'muted'});p.append(individual,advanced,preview);let lamps=checks(individual,'Appareils de cette fonction',Object.entries(config.devices).map(([k,v])=>[k,v.name+(v.kind==='audio'?' (audio)':'')]),selectedDevices(rule.targets)),targets=selectors(advanced,rule.targets);let read=()=>mode()==='Lampes individuelles'?lamps().map(v=>'device:'+v):targets();function update(){individual.hidden=mode()!=='Lampes individuelles';advanced.hidden=mode()!=='Groupes et portée';let ids=selectedDevices(read());preview.textContent=ids.length?'Sélection effective : '+ids.map(id=>config.devices[id].name).join(', '):'Aucune cible : cette fonction ne pilotera aucun appareil.'}p.onchange=update;update();draftPreview=()=>{let c=structuredClone(config),r=c.rules.find(v=>v.id===id);r.targets=read();r.enabled=enabled();return testContext('assignments',id,c)};$('#editorStatus').textContent='';let copy=field(p,'Copier les affectations de','', 'text',['',...config.rules.filter(v=>v.id!==id).map(v=>v.id)]);action('Copier les appareils actuels',()=>{let other=config.rules.find(v=>v.id===copy());if(!other)return;let ids=new Set(selectedDevices(other.targets));for(let input of individual.querySelectorAll('input'))input.checked=ids.has(Object.keys(config.devices)[[...individual.querySelectorAll('input')].indexOf(input)]);let select=p.querySelector('select');select.value='Lampes individuelles';update()},p);$('#remove').hidden=true;$('#form').onsubmit=async e=>{e.preventDefault();try{let current=config.rules.find(v=>v.id===id);current.targets=read();current.enabled=enabled();await persist();editor.close()}catch(e){config=await api('config');message(e.message,true)}};editor.showModal()}
const SETTING_LABELS={render_hz:'Cadence du moteur (Hz)',max_flash_hz:'Plafond du clignotement (Hz, maximum 2)',brightness_threshold:'Écart minimal de luminosité (%)',timeout_s:'Délai maximal de commande (s)',restore_timeout_s:'Délai maximal de restauration (s)',sound_timeout_s:'Délai maximal de diffusion sonore (s)',retry_initial_s:'Délai initial après erreur (s)',retry_max_s:'Délai maximal après erreur (s)',discovery_interval_s:'Actualisation des adresses (s)',ui_refresh_ms:'Actualisation de l’interface (ms)',test_duration_s:'Durée des tests de source (s)'};
const SETTING_HELP={render_hz:'Nombre de calculs par seconde. 10 Hz donne une mise à jour toutes les 100 ms ; augmenter cette valeur ne garantit pas que les lampes suivent plus vite.',max_flash_hz:'Limite autorisée pour les effets : 2 Hz correspond à deux flashes par seconde. Une fréquence supérieure est refusée.',brightness_threshold:'Un changement inférieur à ce nombre de points de luminosité n’envoie pas de nouvelle commande. 3 signifie, par exemple, qu’un passage de 50 % à 51 % est ignoré.',timeout_s:'Temps maximal d’attente d’une commande. Augmenter aide un appareil lent ; diminuer signale les problèmes plus vite.',restore_timeout_s:'Temps laissé aux appareils pour retrouver leur état initial, notamment une scène Hue dynamique.',sound_timeout_s:'Temps maximal laissé à une diffusion sonore. Les sorties sonores restent inactives tant qu’elles ne sont pas configurées.',retry_initial_s:'Attente avant le premier nouvel essai après une erreur. Le délai double lors des échecs suivants.',retry_max_s:'Plafond de cette attente. Doit être au moins égal au délai initial.',discovery_interval_s:'Intervalle entre les recherches d’adresse réseau des appareils déjà appairés.',ui_refresh_ms:'Fréquence de rafraîchissement des indicateurs. 1 500 ms = 1,5 seconde ; cela ne change pas la vitesse des lampes.',test_duration_s:'Durée par défaut des tests de source à durée personnalisée. Les boutons « Tester 3 s » durent toujours trois secondes.'};
const FIELD_HELP={'Identifiant':'Nom technique unique utilisé pour les références. Choisir un nom simple ; modifier les références associées avant de le renommer.','Priorité':'Plus le nombre est élevé, plus la fonction est prioritaire sur une même lampe. Les flashes et les fonds fixes gardent deux priorités séparées.','Exiger le simulateur connecté':'La fonction reste inactive si Glareshield ne reçoit pas de données du simulateur.','Suspendre pendant la pause':'Restaure les lampes de cette fonction pendant une pause du simulateur.','Luminosité (%)':'0 à 100 %. L’extinction se règle avec la case « Allumée ».','Couleur':'RVB pour une couleur choisie, Température pour du blanc, Conserver pour garder la couleur actuelle.','Température (K)':'Blanc chaud vers 2 700 K, neutre vers 4 000 K, froid vers 6 500 K. La plage réellement acceptée dépend de la lampe.','Transition (ms)':'Durée du changement sur Hue. 0 = immédiat ; 1 000 ms = une seconde.','Fréquence des pulsations (Hz)':'Nombre de montées et descentes progressives par seconde. Maximum : le plafond défini dans Réglages.','Fréquence des flashes (Hz)':'Nombre de flashes par seconde. 2 Hz = un cycle de 0,5 seconde. Maximum : le plafond défini dans Réglages.','Luminosité haute (%)':'Intensité pendant la phase lumineuse du flash.','Luminosité basse (%)':'Intensité entre les flashes lorsqu’aucun fond fixe n’est actif. S’il existe un fond ATC ou DOME, ce fond est affiché à la place.','Temps en phase haute (%)':'Part du cycle passée à la luminosité haute. 50 % à 2 Hz = 250 ms en phase haute et 250 ms en phase basse.','Cycles (0 : continu)':'Nombre de cycles avant la fin de l’effet. 0 maintient l’effet tant que sa fonction est active.','Volume (%)':'Volume demandé à la sortie sonore, entre 0 et 100 %.','Répétition (s, 0 : unique)':'0 joue une seule fois ; 10 relance le son toutes les dix secondes tant que la fonction reste active.','Intervalle (ms)':'Temps entre deux lectures de cette source. 100 ms = dix lectures par seconde.','Seuil audio (0 à 1)':'Niveau minimal pour détecter un son. 0,02 est plus sensible que 0,10. Observer le niveau au tableau de bord pour l’ajuster.','Durée minimale (ms)':'Le son doit dépasser le seuil pendant cette durée avant de déclencher la fonction.','Délai entre contacts (s)':'Attente minimale entre deux déclenchements audio pour éviter des activations répétées.','Maintien du contact (s)':'Durée pendant laquelle la détection audio reste active après un déclenchement.','Code de touche Windows (0 : aucun)':'Code de la touche à surveiller : 163 = Ctrl droit. La touche est seulement lue, sans interception.','Source pour table de niveaux':'Source qui choisit le palier, par exemple 0, 1 ou 2 pour DOME.','Valeur de source':'Valeur qui sélectionne ce palier. Pour DOME : 0 = OFF, 1 = DIM, 2 = BRT.'};
function help(parent,text){parent.append(el('p',text,{className:'muted'}))}
function colourText(rgb){let known={'255,0,0':'rouge','255,140,0':'ambre','0,200,255':'cyan','255,255,255':'blanc','0,0,0':'noir'};return known[rgb.join(',')]||'#'+rgb.map(v=>v.toString(16).padStart(2,'0')).join('')}
function lightText(v){if(!v.on)return 'Éteinte';return 'Allumée à '+v.brightness+' %'+(v.color?' · '+colourText(v.color):v.kelvin?' · blanc à '+v.kelvin+' K':' · couleur conservée')+(v.transition_ms?' · transition de '+v.transition_ms+' ms':'')}
function ruleName(id,cfg=config){return cfg.rules.find(r=>r.id===id)?.name||id}
function effectTitle(id,cfg=config){let users=cfg.rules.filter(r=>r.effect===id||r.sound===id).map(r=>r.name||r.id);return users.length?users.join(' / '):OPTION_LABELS[cfg.effects[id]?.type]||id}
function describeEffect(parent,v){parent.append(el('span',OPTION_LABELS[v.type],{className:'tag'}));if(['blink','pulse'].includes(v.type)){parent.append(el('p',colourText(v.color)+' · '+Number((1/v.period_s).toFixed(2))+' '+(v.type==='blink'?'flashes':'cycles')+' par seconde'),el('p','Luminosité : '+v.high+' % en phase haute, '+v.low+' % en phase basse'),el('p',v.type==='blink'?'Un cycle dure '+Math.round(v.period_s*1000)+' ms : '+Math.round(v.period_s*v.duty*1000)+' ms en phase haute, '+Math.round(v.period_s*(1-v.duty)*1000)+' ms en phase basse.':'Montée et descente progressives sur un cycle de '+Math.round(v.period_s*1000)+' ms.'),el('p',v.cycles?v.cycles+' cycles, puis arrêt.':'Continue tant que la fonction est active.'));if(v.type==='blink')help(parent,'Entre les flashes, un fond ATC ou DOME actif remplace la luminosité basse.')}else if(v.type==='static')parent.append(el('p',lightText(v.state)));else if(v.type==='level_map'){for(let [key,state] of Object.entries(v.map))parent.append(el('p','Palier '+key+(key==='0'&&!state.on?' · OFF':({'1':' · DIM','2':' · BRT'}[key]||''))+' : '+lightText(state)))}else parent.append(el('p','Fichier : '+v.file),el('p','Volume : '+Math.round(v.volume*100)+' %'),el('p',v.repeat_s?'Répété toutes les '+v.repeat_s+' secondes.':'Joué une seule fois.'))}
function conditionText(c){if(c.op==='always')return 'Toujours';if(['all','any'].includes(c.op))return c.conditions.map(conditionText).join(c.op==='all'?' ET ':' OU ');return c.source+' '+(OPTION_LABELS[c.op]||c.op)+(c.op==='active'?'':' '+c.value)}
function describeCard(parent,section,id,v){if(section==='effects'){describeEffect(parent,v);return}if(section==='rules'){parent.append(el('p',(v.enabled?'Activée':'Désactivée')+' · priorité '+v.priority),el('p','Déclenchement : '+conditionText(v.condition)),el('p','Effet : '+effectTitle(v.effect)),el('p','Appareils : '+(selectedDevices(v.targets).map(k=>config.devices[k].name).join(', ')||'aucun')));return}if(section==='sources'){parent.append(el('p',OPTION_LABELS[v.type]+' · lecture toutes les '+v.poll_ms+' ms'));if(v.type==='audio_process')parent.append(el('p','Processus : '+v.process_names.join(', ')),el('p','Seuil '+v.threshold+' pendant '+v.min_ms+' ms ; maintien '+v.hold_s+' s ; délai '+v.cooldown_s+' s.'));else if(v.type==='keyboard')parent.append(el('p','Touche surveillée : '+v.key_code+(v.key_code===163?' (Ctrl droit)':'')));else if(v.name)parent.append(el('p','Variable : '+v.name));return}if(Array.isArray(v)){parent.append(el('p',v.map(k=>config.devices[k]?.name||k.replace('group:','Groupe : ')).join(', ')||'Aucun membre'));return}parent.append(el('p',section==='devices'?(v.kind==='audio'?'Sortie audio':'Lampe')+' · '+v.driver:'Contrôleur '+v.type));if(v.controller)parent.append(el('p','Contrôleur : '+v.controller));if(section==='controllers')parent.append(el('p',v.host?'Adresse manuelle : '+v.host:'Adresse trouvée automatiquement sur le réseau'))}
