[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "glareshield"
version = "0.1.0"
description = "Local flight simulator lighting and audio integration"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic==2.14.0", "PyYAML==6.0.3", "httpx==0.28.1",
  "fastapi==0.143.0", "uvicorn==0.54.0", "zeroconf==0.151.5",
  "pyatv==0.18.0", "psutil==7.2.2", "cryptography==50.0.2",
  "pillow==12.3.0", "comtypes==1.4.17; sys_platform == 'win32'",
  "pycaw==20260927; sys_platform == 'win32'",
  "simconnect==0.4.26; sys_platform == 'win32'",
  "pystray==0.19.5; sys_platform == 'win32'",
]

[project.scripts]
glareshield = "glareshield.cli:main"
glareshield-app = "glareshield.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
glareshield = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
cache_dir = "local/test-cache"
