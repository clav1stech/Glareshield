name: Version et publication

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Tester la politique de version
        run: python -m unittest discover -s tests -p test_version.py
      - name: Vérifier la version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          REF_TYPE: ${{ github.ref_type }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python scripts/version.py check --tag "$TAG_NAME"
          elif [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]; then
            python scripts/version.py check --base "$BASE_SHA"
          else
            python scripts/version.py check
          fi

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Publier la release depuis le journal des changements
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          python scripts/version.py check --tag "$TAG_NAME"
          python scripts/version.py notes --series > "$RUNNER_TEMP/release-notes.md"
          title=$(python scripts/version.py release-title)
          series="${title%% *}"
          # Une release par vX.Y : elle suit le dernier tag vX.Y.Z et reprend tout le journal de la série.
          existing=$(gh release list --limit 200 --json tagName,name --jq ".[] | select(.name == \"$series\" or (.name | startswith(\"$series \"))) | .tagName" | head -n 1)
          if [ -n "$existing" ] && [ "$existing" != "$TAG_NAME" ]; then
            gh release edit "$existing" --tag "$TAG_NAME" --title "$title" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          elif [ -n "$existing" ]; then
            gh release edit "$TAG_NAME" --title "$title" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          else
            gh release create "$TAG_NAME" --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
